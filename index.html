<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Forkway</title>
  <meta name="description" content="NYC transit directions that show every place you could switch lines, while you ride.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <button class="icon-button" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <h1 id="title">Forkway</h1>
  </header>

  <div class="alert" id="alert" role="alert" hidden></div>

  <!-- Plan a trip -->
  <main class="view" id="plan-view">
    <form class="planner" id="plan-form" autocomplete="off">
      <div class="place-field">
        <span class="dot start" aria-hidden="true"></span>
        <label class="sr-only" for="from-input">From</label>
        <input id="from-input" placeholder="Current location" enterkeyhint="next">
        <button type="button" class="icon-button" id="use-location" aria-label="Use my location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></svg>
        </button>
      </div>
      <div class="place-field">
        <span class="dot end" aria-hidden="true"></span>
        <label class="sr-only" for="to-input">To</label>
        <input id="to-input" placeholder="Where to? (e.g. W 181 St & Amsterdam)" enterkeyhint="search">
      </div>
      <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
      <div class="when">
        <select id="when-mode" aria-label="When">
          <option value="now">Leave now</option>
          <option value="at">Leave at…</option>
        </select>
        <input type="datetime-local" id="when-time" aria-label="Departure time" hidden>
      </div>
      <button class="primary wide" id="plan-button" type="submit" disabled>Loading NYC transit…</button>
    </form>

    <p class="status" id="status" role="status"></p>
    <section class="results" id="results" aria-label="Trip options"></section>

    <section class="recents" id="recents" hidden>
      <h2>Recent</h2>
      <ul id="recent-list"></ul>
    </section>

    <p class="footnote" id="footnote"></p>
  </main>

  <!-- A trip: preview, then live -->
  <section class="view trip-view" id="trip-view" hidden>
    <div class="map" id="map"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheet-content"></div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
