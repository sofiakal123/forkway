<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Forkway</title>
  <meta name="description" content="NYC transit directions that show every place you could switch lines, while you ride.">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111212" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <span class="brand" id="title">forkway</span>
    <button class="data-pill" id="data-pill" type="button" aria-live="polite">
      <span class="data-dot" aria-hidden="true"></span>
      <span id="data-label">Saved data</span>
    </button>
  </header>

  <div class="toast" id="alert" role="alert" hidden></div>

  <!-- Plan a trip -->
  <main class="view" id="plan-view">
    <h1 class="headline">Where to?</h1>

    <form class="planner" id="plan-form" autocomplete="off">
      <div class="places">
        <div class="place-field">
          <span class="marker from" aria-hidden="true"></span>
          <label class="sr-only" for="from-input">From</label>
          <input id="from-input" placeholder="Current location" enterkeyhint="next">
          <button type="button" class="icon-button small" id="use-location" aria-label="Use my location">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3" /></svg>
          </button>
        </div>
        <div class="place-field">
          <span class="marker to" aria-hidden="true"></span>
          <label class="sr-only" for="to-input">To</label>
          <input id="to-input" placeholder="Search a stop, street or place" enterkeyhint="search">
        </div>
      </div>
      <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
      <div class="when">
        <select id="when-mode" aria-label="When">
          <option value="now">Leave now</option>
          <option value="at">Leave at…</option>
        </select>
        <input type="datetime-local" id="when-time" aria-label="Departure time" hidden>
      </div>
      <button class="primary wide" id="plan-button" type="submit" disabled>Loading NYC transit…</button>
    </form>

    <p class="status" id="status" role="status"></p>
    <section class="results" id="results" aria-label="Trip options"></section>

    <section class="block" id="recents" hidden>
      <h2 class="label">Recent</h2>
      <ul class="list" id="recent-list"></ul>
    </section>

    <section class="block" aria-label="Data">
      <h2 class="label">Data</h2>
      <div class="list data-panel" id="data-panel"></div>
      <p class="fine" id="footnote"></p>
    </section>
  </main>

  <!-- A trip: preview, then live -->
  <section class="view trip-view" id="trip-view" hidden>
    <div class="map" id="map"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheet-content"></div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
